<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-label="Request đi qua Guardrail trên MaaS Gateway theo thứ tự Word filters, Prompt-based filter, Sensitive information rồi mới tới model; hai lớp đầu có thể trả HTTP 400, lớp cuối chỉ che dữ liệu; response của model chưa qua Guardrail." font-family="'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="currentColor" style="max-width:100%;height:auto">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="arr-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--block)"/></marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  </defs>

  <!-- Client -->
  <rect x="30" y="150" width="160" height="150" rx="10" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/>
  <text x="110" y="200" text-anchor="middle" font-size="15" font-weight="700">Ứng dụng</text>
  <text x="110" y="226" text-anchor="middle" fill="var(--muted)">endpoint MaaS + API key</text>
  <text x="110" y="244" text-anchor="middle" fill="var(--muted)">không cần sửa code</text>

  <!-- Gateway -->
  <rect x="250" y="40" width="770" height="370" rx="14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="270" y="68" font-size="13" font-weight="700" letter-spacing="0.6">MaaS GATEWAY</text>

  <!-- Guardrail band -->
  <rect x="280" y="90" width="580" height="290" rx="12" fill="var(--band)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="300" y="118" font-size="15" font-weight="700" fill="var(--accent)">GUARDRAIL</text>
  <text x="400" y="118" fill="var(--muted)">kiểm tra nội dung gửi lên, trước khi tới model</text>

  <!-- Stage 1 -->
  <rect x="300" y="140" width="166" height="160" rx="8" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"/>
  <text x="383" y="168" text-anchor="middle" font-size="13" font-weight="700">1 · Word filters</text>
  <text x="383" y="196" text-anchor="middle">có từ / cụm từ cấm?</text>
  <text x="383" y="214" text-anchor="middle">(danh sách bạn liệt kê)</text>
  <rect x="309" y="258" width="44" height="22" rx="11" fill="none" stroke="var(--accent)"/><text x="331" y="273" text-anchor="middle" font-size="11" fill="var(--accent)">Mask</text>
  <rect x="357" y="258" width="50" height="22" rx="11" fill="none" stroke="var(--accent)"/><text x="382" y="273" text-anchor="middle" font-size="11" fill="var(--accent)">Detect</text>
  <rect x="411" y="258" width="46" height="22" rx="11" fill="var(--block)" stroke="var(--block)"/><text x="434" y="273" text-anchor="middle" font-size="11" fill="var(--on-block)">Block</text>

  <!-- Stage 2 -->
  <rect x="487" y="140" width="166" height="160" rx="8" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"/>
  <text x="570" y="168" text-anchor="middle" font-size="13" font-weight="700">2 · Prompt-based filter</text>
  <text x="570" y="196" text-anchor="middle">AI giám sát đọc nội dung</text>
  <text x="570" y="214" text-anchor="middle">theo rule bạn mô tả</text>
  <rect x="518" y="258" width="50" height="22" rx="11" fill="none" stroke="var(--accent)"/><text x="543" y="273" text-anchor="middle" font-size="11" fill="var(--accent)">Detect</text>
  <rect x="574" y="258" width="46" height="22" rx="11" fill="var(--block)" stroke="var(--block)"/><text x="597" y="273" text-anchor="middle" font-size="11" fill="var(--on-block)">Block</text>

  <!-- Stage 3 -->
  <rect x="674" y="140" width="166" height="160" rx="8" fill="var(--surface)" stroke="currentColor" stroke-width="1.2"/>
  <text x="757" y="168" text-anchor="middle" font-size="13" font-weight="700">3 · Sensitive info</text>
  <text x="757" y="196" text-anchor="middle">có SĐT, email, số thẻ…?</text>
  <text x="757" y="214" text-anchor="middle">che lại rồi gửi tiếp</text>
  <rect x="681" y="258" width="44" height="22" rx="11" fill="none" stroke="var(--accent)"/><text x="703" y="273" text-anchor="middle" font-size="11" fill="var(--accent)">Mask</text>
  <rect x="729" y="258" width="54" height="22" rx="11" fill="none" stroke="var(--accent)"/><text x="756" y="273" text-anchor="middle" font-size="11" fill="var(--accent)">Replace</text>
  <rect x="787" y="258" width="48" height="22" rx="11" fill="none" stroke="var(--accent)"/><text x="811" y="273" text-anchor="middle" font-size="11" fill="var(--accent)">Delete</text>

  <!-- Flow arrows -->
  <line x1="190" y1="220" x2="298" y2="220" stroke="currentColor" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="196" y="208" text-anchor="start" font-size="11" fill="var(--muted)">input</text>
  <line x1="466" y1="220" x2="485" y2="220" stroke="currentColor" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="653" y1="220" x2="672" y2="220" stroke="currentColor" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="840" y1="220" x2="888" y2="220" stroke="currentColor" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Model -->
  <rect x="890" y="170" width="110" height="100" rx="10" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/>
  <text x="945" y="214" text-anchor="middle" font-size="15" font-weight="700">Model</text>
  <text x="945" y="238" text-anchor="middle" font-size="11" fill="var(--muted)">nội dung đã lọc</text>

  <!-- Block path -->
  <path d="M383,300 L383,350" fill="none" stroke="var(--block)" stroke-width="1.8"/>
  <path d="M570,300 L570,350" fill="none" stroke="var(--block)" stroke-width="1.8"/>
  <path d="M570,350 L192,350" fill="none" stroke="var(--block)" stroke-width="1.8" marker-end="url(#arr-block)"/>
  <rect x="400" y="336" width="150" height="28" rx="6" fill="var(--block-soft)" stroke="var(--block)"/>
  <text x="475" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="var(--block)">Chặn · trả lỗi 400</text>

  <!-- Response path -->
  <path d="M945,270 L945,440 L110,440 L110,302" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr-muted)"/>
  <rect x="400" y="425" width="330" height="30" rx="6" fill="var(--surface)" stroke="var(--muted)"/>
  <text x="565" y="444" text-anchor="middle" fill="var(--muted)">câu trả lời của model · không qua Guardrail</text>
</svg>
