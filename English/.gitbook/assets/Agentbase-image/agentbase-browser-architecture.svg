<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="1200" height="510" fill="#ffffff"/>

  <!-- User -->
  <circle cx="80" cy="228" r="20" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M46,292 V276 a34,26 0 0 1 68,0 V292 Z" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="80" y="322" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">User</text>

  <!-- User <-> Agent -->
  <path d="M130,235 H234" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="182" y="226" text-anchor="middle" font-size="15" fill="#111827">Query</text>
  <path d="M236,270 H132" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="182" y="290" text-anchor="middle" font-size="15" fill="#111827">Result</text>

  <!-- Agent, with the automation library it drives the browser through -->
  <rect x="240" y="200" width="320" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="310" y="258" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">Agent</text>
  <rect x="390" y="218" width="155" height="64" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="467" y="242" text-anchor="middle" font-size="14" fill="#111827">Automation library</text>
  <text x="467" y="264" text-anchor="middle" font-size="12" fill="#4b5563">Playwright, browser-use</text>

  <!-- LLM -->
  <rect x="470" y="40" width="220" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="580" y="70" text-anchor="middle" font-size="17" fill="#111827">Large Language</text>
  <text x="580" y="92" text-anchor="middle" font-size="17" fill="#111827">Model (LLM)</text>

  <!-- Agent <-> LLM -->
  <path d="M300,200 V65 H466" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="312" y="57" font-size="15" fill="#111827">1. Prompt + tools</text>
  <path d="M470,95 H340 V196" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="352" y="88" font-size="15" fill="#111827">2. Tool call</text>
  <text x="352" y="134" font-size="12" fill="#4b5563" font-family="ui-monospace, Menlo, Consolas, monospace">click, type, goto…</text>

  <!-- Browser -->
  <rect x="760" y="160" width="390" height="240" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="955" y="186" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Browser</text>
  <text x="955" y="206" text-anchor="middle" font-size="13" fill="#4b5563">isolated sandbox, created once and reused</text>

  <!-- Session -->
  <rect x="785" y="220" width="340" height="160" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="805" y="238" width="300" height="88" rx="4" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="955" y="276" text-anchor="middle" font-size="16" fill="#111827">Chromium</text>
  <text x="955" y="298" text-anchor="middle" font-size="12" fill="#4b5563">opens and works the web pages</text>
  <text x="955" y="362" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Session</text>

  <!-- Agent -> Session -->
  <path d="M545,250 H781" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="663" y="240" text-anchor="middle" font-size="15" fill="#111827">3. Commands (CDP)</text>
  <text x="663" y="272" text-anchor="middle" font-size="12" fill="#4b5563" font-family="ui-monospace, Menlo, Consolas, monospace">…/automation-stream</text>

  <!-- Session -> Agent -->
  <path d="M900,400 V430 H470 V304" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="685" y="422" text-anchor="middle" font-size="15" fill="#111827">4. Page content, screenshot</text>

  <!-- Live view -->
  <path d="M1050,400 V480 H80 V336" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text x="565" y="472" text-anchor="middle" font-size="15" fill="#111827">Live view: watch the session as it happens, in an iframe</text>
</svg>
